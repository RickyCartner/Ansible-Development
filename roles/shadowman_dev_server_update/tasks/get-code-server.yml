---
- name: Download code-server
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  vars:
    version: latest
    codeserver_url: https://github.com/coder/code-server/releases/download/v{{ version }}/code-server-{{ version }}-amd64.rpm
    # GITHUB_TOKEN: ""
    _gethub_api_headers: ""
    # github_api_headers: "{{ {'GITHUB_TOKEN': lookup('ansible.builtin.env', 'GITHUB_TOKEN')} if (lookup('ansible.builtin.env', 'GITHUB_TOKEN')) else {} }}"

  tasks:
    - name: Discover latest code-server release
      ansible.builtin.set_fact:
        version: "{{ (lookup('url', 'https://api.github.com/repos/coder/code-server/releases/latest',
                    split_lines=False) | from_json).get('tag_name')
                    | replace('v', '') }}"
                    # headers=_github_api_headers, split_lines=False) | from_json).get('tag_name')
                    # | replace('v', '') }}"
      run_once: true
      until: version is version('0.0.0', '>=')
      retries: 10
      when: version == "latest"

    - name: Display latest code-server release
      ansible.builtin.debug:
        msg:
          - "The current code-server release version is: {{ version }}"
          - "The url to download is: {{ codeserver_url }}"

    - name: Download New code-server
      ansible.builtin.get_url:
        url: "{{ codeserver_url }}"
        dest: /tmp/code-server.rpm
        mode: "0440"

    - name: Copy to local server
      ansible.builtin.copy:
        src: /tmp/code-server.rpm
        dest: /app/code-server.rpm
        remote_src: true
        mode: "0744"
